<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160" role="img" aria-label="Copa Libertadores de América">
  <defs>
    <!-- Plata bruñida (Cuerpo de la Copa y Globo) -->
    <linearGradient id="silverLib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#475569" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Madera Caoba Oscura (Pedestal de 3 niveles) -->
    <linearGradient id="woodPedestal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A2511"/>
      <stop offset="25%" stop-color="#2D1508"/>
      <stop offset="50%" stop-color="#5E3117"/>
      <stop offset="75%" stop-color="#1F0E05"/>
      <stop offset="100%" stop-color="#3D1E0E"/>
    </linearGradient>

    <!-- Placas de Campeón en Oro -->
    <linearGradient id="goldPlaque" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8A6D1F"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 1. PEDESTAL DE MADERA CAOBA (3 NIVELES CON PLACAS DE CAMPEONES) -->
    <!-- Base inferior -->
    <path d="M26 142 h68 l6 12 h-80 z" fill="url(#woodPedestal)"/>
    <rect x="28" y="140" width="64" height="3" fill="#1F0E05"/>

    <!-- Nivel 3 (Inferior) -->
    <rect x="32" y="112" width="56" height="28" rx="2" fill="url(#woodPedestal)"/>
    <!-- Placas doradas -->
    <rect x="35" y="116" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="49" y="116" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="63" y="116" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="77" y="116" width="8" height="6" rx="1" fill="url(#goldPlaque)"/>

    <rect x="35" y="124" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="49" y="124" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="63" y="124" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="77" y="124" width="8" height="6" rx="1" fill="url(#goldPlaque)"/>

    <rect x="35" y="132" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="49" y="132" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="63" y="132" width="12" height="6" rx="1" fill="url(#goldPlaque)"/>
    <rect x="77" y="132" width="8" height="6" rx="1" fill="url(#goldPlaque)"/>

    <!-- Nivel 2 (Medio) -->
    <rect x="36" y="88" width="48" height="24" rx="2" fill="url(#woodPedestal)"/>
    <rect x="39" y="92" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="52" y="92" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="65" y="92" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>

    <rect x="39" y="100" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="52" y="100" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="65" y="100" width="11" height="5.5" rx="1" fill="url(#goldPlaque)"/>

    <!-- Nivel 1 (Superior) -->
    <rect x="40" y="68" width="40" height="20" rx="2" fill="url(#woodPedestal)"/>
    <rect x="43" y="72" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="55" y="72" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="67" y="72" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>

    <rect x="43" y="80" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="55" y="80" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>
    <rect x="67" y="80" width="10" height="5" rx="1" fill="url(#goldPlaque)"/>

    <!-- Anillo superior de plata que une el pedestal con el cáliz -->
    <rect x="44" y="64" width="32" height="4" rx="1" fill="url(#silverLib)"/>

    <!-- 2. CÁLIZ Y COLUMNA PRINCIPAL EN PLATA -->
    <path d="M52 64 L52 52 L48 52 L48 48 L72 48 L72 52 L68 52 L68 64 Z" fill="url(#silverLib)"/>

    <!-- 3. ESFERA / GLOBO TERRÁQUEO CENTRAL (SIMBOLO DE AMÉRICA) -->
    <circle cx="60" cy="38" r="18" fill="url(#silverLib)"/>
    <circle cx="60" cy="38" r="18" fill="url(#silverHighlight)"/>
    <!-- Anillo ecuatorial y paralelos -->
    <ellipse cx="60" cy="38" rx="18" ry="6" fill="none" stroke="#475569" stroke-width="1.2"/>
    <ellipse cx="60" cy="38" rx="14" ry="14" fill="none" stroke="#475569" stroke-width="0.8" stroke-dasharray="2,2"/>
    <!-- Continente estilizado -->
    <path d="M54 28 C57 30 62 29 65 33 C67 36 64 42 61 46 C58 48 56 42 54 38 Z" fill="#94A3B8" opacity="0.6"/>

    <!-- 4. ASAS LATERALES CURVAS DE PLATA -->
    <path d="M42 38 C32 38 28 26 36 20 C42 16 46 22 44 26 C40 30 38 34 42 38 Z" fill="url(#silverLib)"/>
    <path d="M78 38 C88 38 92 26 84 20 C78 16 74 22 76 26 C80 30 82 34 78 38 Z" fill="url(#silverLib)"/>

    <!-- 5. FIGURA DEL JUGADOR VICTORIOSO EN LA CIMA -->
    <!-- Base de la escultura -->
    <ellipse cx="60" cy="20" rx="7" ry="2.5" fill="url(#silverLib)"/>
    <!-- Escultura atleta con los brazos alzados sosteniendo el balón -->
    <path d="M58 20 L58 14 L56 10 L60 6 L64 10 L62 14 L62 20 Z" fill="url(#silverLib)"/>
    <!-- Pelota en las manos -->
    <circle cx="60" cy="5" r="3.2" fill="url(#goldPlaque)"/>
  </g>
</svg>
