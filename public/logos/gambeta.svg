<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Gambeta">
  <defs>
    <linearGradient id="gbBadge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc0ef"/>
      <stop offset="1" stop-color="#3f7fc4"/>
    </linearGradient>
    <linearGradient id="gbGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe58a"/>
      <stop offset="1" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <!-- Badge -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#gbBadge)"/>
  <rect x="6" y="6" width="88" height="88" rx="24" fill="none" stroke="#0a1424" stroke-opacity="0.25" stroke-width="2"/>
  <!-- Estela de gambeta (dribbling) dorada -->
  <path d="M18 74 C 30 58, 40 66, 52 52 C 62 40, 70 46, 82 30"
        fill="none" stroke="url(#gbGold)" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  <path d="M18 74 C 30 58, 40 66, 52 52 C 62 40, 70 46, 82 30"
        fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1 7" opacity="0.7"/>
  <!-- Pelota -->
  <g transform="translate(63,34)">
    <circle r="15" fill="#ffffff" stroke="#0a1424" stroke-width="1.5"/>
    <path d="M0 -8 L7.6 -2.5 L4.7 6.5 L-4.7 6.5 L-7.6 -2.5 Z" fill="#0a1424"/>
  </g>
  <!-- Inicial G estilizada -->
  <text x="34" y="72" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" opacity="0.96">G</text>
</svg>
