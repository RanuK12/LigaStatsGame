  <!-- Inner border -->
  <path d="M50 12 L84 25 L84 55 Q84 85 50 108 Q16 85 16 55 L16 25 Z" 
        fill="none" stroke="#FEDD00" stroke-width="1" opacity="0.4"/>
  <!-- Initials -->
  <text x="50" y="62" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">AFA</text>
  <!-- Club name small -->
  <text x="50" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FFFFFF" opacity="0.8">ARGENTINA</text>
</svg>