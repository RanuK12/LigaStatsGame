name: Weekly Data Update

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape updated player data
        run: |
          node scripts/scrape-players.mjs || echo "Scraper finished with warnings"
          python3 scripts/build_squads.py || echo "Squads build finished with warnings"
          python3 scripts/build_data.py || echo "Data build finished with warnings"
        continue-on-error: true

      - name: Build app
        run: npm run build

      - name: Commit updated data
        run: |
          git config user.name "Ranukita Bot"
          git config user.email "ranucoliemilio@gmail.com"
          git add data/ || true
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git diff --cached --quiet || git commit -m "🔄 Weekly data update: $TIMESTAMP"
          git push
