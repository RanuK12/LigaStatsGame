name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Refresca resultados en vivo cada 3h (el build corre prebuild -> fetch:scores).
    - cron: "0 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # El arranque de GitHub trae `false` para no cortar un despliegue de producción a medias, y
  # eso acá salió caro: el 6 de agosto la corrida #307 dejó el job `deploy` en "waiting" contra
  # el entorno github-pages y se quedó así DOS DÍAS. Como el grupo no se soltaba, todas las
  # corridas siguientes quedaban en cola y GitHub iba cancelando la vieja cada vez que entraba
  # una nueva: 20 corridas canceladas y nada publicado entre el 6 y el 8.
  #
  # Esto es un sitio estático: el build más nuevo siempre reemplaza al anterior, no hay
  # despliegue parcial que proteger. Con `true`, un push nuevo destraba solo lo que quedó colgado.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          # NEXT_PUBLIC_* se hornean en el build. Son públicos por diseño (van al bundle
          # cliente), así que pueden ser Secrets o Variables del repo. Vacíos = feature
          # deshabilitada con fallback. Config en Settings > Secrets and variables > Actions.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SPORTSDB_KEY: ${{ secrets.NEXT_PUBLIC_SPORTSDB_KEY }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Un job colgado contra el entorno no puede volver a bloquear la cola indefinidamente.
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
