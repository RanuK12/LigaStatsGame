<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gambeta Twitter Banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,800;0,900;1,900&family=Sora:wght@700;800;900&family=Space+Grotesk:wght@700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 3000px;
    height: 1000px;
    background: #030712;
    overflow: hidden;
    font-family: 'Sora', sans-serif;
    color: #ffffff;
    position: relative;
  }

  /* Fondo Estadio & Luces Neón */
  .stadium-bg {
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(116, 172, 223, 0.35) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(246, 199, 80, 0.25) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(12, 25, 46, 0.9) 0%, #030712 100%);
  }

  /* Rayos de luz diagonales */
  .light-beam-1 {
    position: absolute;
    top: -300px;
    left: 200px;
    width: 600px;
    height: 1600px;
    background: linear-gradient(135deg, rgba(116, 172, 223, 0.18) 0%, transparent 70%);
    transform: rotate(25deg);
    pointer-events: none;
  }

  .light-beam-2 {
    position: absolute;
    top: -300px;
    right: 300px;
    width: 700px;
    height: 1600px;
    background: linear-gradient(225deg, rgba(246, 199, 80, 0.15) 0%, transparent 70%);
    transform: rotate(-25deg);
    pointer-events: none;
  }

  /* Líneas tácticas de cancha */
  .pitch-lines {
    position: absolute;
    inset: 0;
    opacity: 0.04;
    background-image: 
      linear-gradient(to right, #ffffff 2px, transparent 2px),
      linear-gradient(to bottom, #ffffff 2px, transparent 2px);
    background-size: 100px 100px;
  }

  /* Contenido principal */
  .container {
    position: relative;
    z-index: 10;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 160px;
  }

  .left-side {
    max-width: 1700px;
  }

  /* Tag oficial superior */
  .official-tag {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(116, 172, 223, 0.12);
    border: 2px solid rgba(116, 172, 223, 0.4);
    padding: 12px 32px;
    border-radius: 100px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #74ACDF;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    box-shadow: 0 0 30px rgba(116, 172, 223, 0.2);
  }

  /* Título GAMBETA 3D */
  .main-title {
    font-family: 'Kanit', sans-serif;
    font-size: 190px;
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: 12px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #FFFFFF 30%, #94A3B8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 40px rgba(116, 172, 223, 0.4));
    margin-bottom: 20px;
  }

  .main-title span {
    background: linear-gradient(180deg, #FFE9A8 0%, #F6C750 60%, #D4AF37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Subtítulo */
  .subtitle {
    font-family: 'Sora', sans-serif;
    font-size: 42px;
    font-weight: 800;
    color: #F6C750;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 48px;
    text-shadow: 0 4px 16px rgba(0,0,0,0.8);
  }

  /* Píldoras / Cards Glassmorphism */
  .feature-grid {
    display: flex;
    gap: 24px;
  }

  .feature-card {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(20px);
    border: 2px solid rgba(255, 255, 255, 0.12);
    padding: 20px 36px;
    border-radius: 24px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 30px;
    font-weight: 700;
    color: #E2E8F0;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }

  .feature-card.gold {
    border-color: rgba(246, 199, 80, 0.5);
    background: rgba(246, 199, 80, 0.12);
    color: #FFE9A8;
  }

  .feature-card.blue {
    border-color: rgba(116, 172, 223, 0.5);
    background: rgba(116, 172, 223, 0.12);
    color: #93C5FD;
  }

  .feature-card.green {
    border-color: rgba(52, 211, 153, 0.5);
    background: rgba(52, 211, 153, 0.12);
    color: #6EE7B7;
  }

  /* Costado Derecho: Tarjetas de Leyendas Renderizadas */
  .right-side {
    position: relative;
    width: 800px;
    height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .legend-card-1 {
    position: absolute;
    width: 320px;
    height: 480px;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 4px solid #F6C750;
    border-radius: 36px;
    transform: rotate(-12deg) translateY(-20px);
    box-shadow: -20px 30px 60px rgba(0,0,0,0.8), 0 0 40px rgba(246, 199, 80, 0.3);
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .legend-card-2 {
    position: absolute;
    width: 340px;
    height: 500px;
    background: linear-gradient(135deg, #0b1526 0%, #030712 100%);
    border: 4px solid #74ACDF;
    border-radius: 36px;
    transform: rotate(8deg) translateX(80px);
    box-shadow: 20px 30px 60px rgba(0,0,0,0.9), 0 0 50px rgba(116, 172, 223, 0.4);
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-ovr {
    font-family: 'Kanit', sans-serif;
    font-size: 72px;
    font-weight: 900;
    line-height: 1;
  }

  .card-ovr.gold { color: #F6C750; }
  .card-ovr.blue { color: #74ACDF; }

  .card-pos {
    font-size: 24px;
    font-weight: 800;
    color: #94A3B8;
    text-transform: uppercase;
  }

  .card-name {
    font-family: 'Kanit', sans-serif;
    font-size: 32px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .card-team {
    font-size: 20px;
    color: #CBD5E1;
  }

  /* Badge Dominio Web */
  .domain-badge {
    position: absolute;
    bottom: 50px;
    left: 160px;
    background: linear-gradient(90deg, #F6C750 0%, #D4AF37 100%);
    color: #030712;
    padding: 18px 48px;
    border-radius: 100px;
    font-family: 'Kanit', sans-serif;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 2px;
    box-shadow: 0 10px 40px rgba(246, 199, 80, 0.4);
    display: flex;
    align-items: center;
    gap: 16px;
  }
</style>
</head>
<body>
  <div class="stadium-bg"></div>
  <div class="light-beam-1"></div>
  <div class="light-beam-2"></div>
  <div class="pitch-lines"></div>

  <div class="container">
    <div class="left-side">
      <div class="official-tag">
        <span>⚽</span> GAMBETA · EL JUEGO DEL FÚTBOL ARGENTINO
      </div>
      
      <div class="main-title">
        GAM<span>BETA</span>
      </div>

      <div class="subtitle">
        ARMÁ TU 11 IDEAL · MODO CARRERA 15 AÑOS · RETO DIARIO
      </div>

      <div class="feature-grid">
        <div class="feature-card gold">
          <span>🏆</span> 378+ Clubes & Planteles '94 a Hoy
        </div>
        <div class="feature-card blue">
          <span>🔥</span> Ruleta de Leyendas
        </div>
        <div class="feature-card green">
          <span>⚡</span> 100% Gratis en Navegador
        </div>
      </div>
    </div>

    <div class="right-side">
      <div class="legend-card-1">
        <div>
          <div class="card-ovr gold">94</div>
          <div class="card-pos">MCO · LEYENDA</div>
        </div>
        <div>
          <div class="card-name">D. MARADONA</div>
          <div class="card-team">🇦🇷 Argentina '86</div>
        </div>
      </div>

      <div class="legend-card-2">
        <div>
          <div class="card-ovr blue">95</div>
          <div class="card-pos">ED · LEYENDA</div>
        </div>
        <div>
          <div class="card-name">L. MESSI</div>
          <div class="card-team">🇦🇷 Selección 2022</div>
        </div>
      </div>
    </div>

    <div class="domain-badge">
      <span>🌐</span> gambetafutbol.games
    </div>
  </div>
</body>
</html>
